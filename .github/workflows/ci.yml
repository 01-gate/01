name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Import-time config validation needs non-secret placeholders.
      # Tests use mocked transports/stub mode and must not call NanoGPT.
      NANOGPT_INFERENCE_BASE_URL: https://api.nano-gpt.com/v1
      NANOGPT_API_KEY: ci-placeholder-not-a-real-key
      GATEWAY_TEST_API_KEY: ci-gateway-test-key
      GATEWAY_UPSTREAM: stub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q
